version: '3.8'

services:
  db:
    image: mysql:8.0.20 # OS MISCONFIGURATION: OUTDATED SERVER PACKAGES & KERNEL VERSION
    container_name: MyEduConnect_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: MyEduConnect_db
    ports:
      # SERVER MISCONFIGURATION: EXPOSURE OF MYSQL DB PORT
      - "3306:3306"
    volumes:
      # This points to the init.sql we drafted earlier to build your vulnerable tables
    - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
  
  adminer:  # <--- This must be aligned with 'db:'
    image: adminer
    container_name: MyEduConnect_db_admin
    restart: always
    ports:
      # SERVER MISCONFIGURATION: EXPOSED ADMIN SERVICE WITH WEAK CREDENTIALS (the rootpassword)
      - "8080:8080"