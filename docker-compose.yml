version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: MyEduConnect_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: MyEduConnect_db
    ports:
      - "3306:3306"
    volumes:
      # This points to the init.sql we drafted earlier to build your vulnerable tables
    - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql